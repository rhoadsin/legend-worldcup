<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레전드 월드컵 — 축구선수 이상형 월드컵 &amp; 드림 스쿼드</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="레전드월드컵">
<meta name="application-name" content="레전드월드컵">
<meta name="theme-color" content="#0a1120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1120; --bg2:#0f1a2e; --card:#14203a; --card2:#1a2948; --line:#263a60;
  --text:#eaf0fa; --muted:#8c9bb8; --accent:#c8ff3d; --accent-ink:#13200a;
  --FW:#ff5c61; --MF:#2fd47c; --DF:#3ea2ff; --GK:#ffb21f;
  --r:16px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;}
body{min-height:100dvh;background:
  radial-gradient(1200px 500px at 50% -200px,#1b3a2a55,transparent 70%),
  repeating-linear-gradient(180deg,#0a1120 0 64px,#0b1323 64px 128px);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:calc(14px + var(--sat)) 16px calc(28px + var(--sab))}
.view{display:none}.view.on{display:block}
.disp{font-family:"Black Han Sans",-apple-system,sans-serif;font-weight:400;letter-spacing:.5px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:#ff8a8a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pos{display:inline-block;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;color:#081018;letter-spacing:.3px}
.pos.FW{background:var(--FW)}.pos.MF{background:var(--MF)}.pos.DF{background:var(--DF)}.pos.GK{background:var(--GK)}

/* HOME */
.hero{text-align:center;padding:18px 0 8px}
.hero h1{font-size:40px;margin:0;line-height:1.05}
.hero h1 b{color:var(--accent);font-weight:400}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}
.resume{margin:16px 0 0;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#24411a,#16263f);border:1px solid #3e6b2a;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sec-t{margin:22px 0 10px;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:1px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{position:relative;text-align:left;padding:16px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;min-height:112px}
.mode.big{grid-column:1/-1;min-height:120px;background:linear-gradient(120deg,#1f3567,#14203a 60%)}
.mode .n{font-size:30px;line-height:1}
.mode .t{font-size:16px;font-weight:800;margin-top:6px}
.mode .s{font-size:12px;color:var(--muted);margin-top:4px}
.mode .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.mode .done{position:absolute;right:10px;top:10px;font-size:11px;font-weight:800;background:#ffffff14;padding:3px 8px;border-radius:999px;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tool{padding:16px 14px;border-radius:var(--r);background:var(--bg2);border:1px dashed var(--line);text-align:left}
.tool b{display:block;font-size:16px}
.tool span{font-size:12px;color:var(--muted)}
.foot{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.6}
@media(min-width:760px){.modes{grid-template-columns:repeat(4,1fr)}.mode.big{grid-column:1/-1}.hero h1{font-size:54px}}

/* MATCH */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead .ttl{text-align:center;flex:1}
.mhead .ttl .r{font-size:28px;line-height:1.1}
.mhead .ttl .m{font-size:12px;color:var(--muted);font-weight:700}
.prog{height:6px;background:var(--bg2);border-radius:99px;margin:10px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pcount{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vs{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:3;width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 5px var(--bg),0 6px 20px #000a}
.pc{position:relative;display:block;width:100%;text-align:left;border-radius:18px;overflow:hidden;background:var(--card);border:2px solid var(--line);transition:transform .25s,opacity .25s,border-color .2s}
.pc:hover{border-color:#41598a}
.pc .ph{aspect-ratio:3/4;max-height:58dvh;width:100%}
.pc .info{padding:10px 10px 12px}
.pc .ko{font-size:18px;font-weight:900;line-height:1.2;word-break:keep-all}
.pc .en{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .club{font-size:12.5px;margin-top:6px;color:#cfd9ec;display:flex;gap:6px;align-items:center}
.pc .club:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--muted);flex:none}
.pc.win{transform:scale(1.03);border-color:var(--accent)}
.pc.lose{opacity:.25;transform:scale(.96)}
.cam{position:absolute;right:8px;top:8px;z-index:2;width:36px;height:36px;border-radius:50%;background:#0a1120cc;border:1px solid #ffffff30;display:grid;place-items:center;font-size:16px}
.pc .posb{position:absolute;left:8px;top:8px;z-index:2}
.mfoot{display:flex;justify-content:center;gap:10px;margin-top:14px}
@media(min-width:760px){.duel{gap:28px}.pc .ko{font-size:24px}.vs{width:64px;height:64px;font-size:26px}.pc .ph{max-height:52vh}}

/* avatar / placeholder */
.ph{position:relative;background:#0e1830;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.ph .sil{position:absolute;inset:0;display:grid;place-items:center}
.ph .sil svg{width:62%;height:auto;opacity:.9}
.ph .sil .ini{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-family:"Black Han Sans",sans-serif;font-size:clamp(14px,5vw,30px);color:#ffffffd0;letter-spacing:1px}
.ph.FW{background:linear-gradient(160deg,#5a1f2a,#1a1424)}.ph.MF{background:linear-gradient(160deg,#164a32,#101c22)}
.ph.DF{background:linear-gradient(160deg,#173d66,#0f1729)}.ph.GK{background:linear-gradient(160deg,#5c4310,#1b170f)}

/* RESULT */
.champ{margin:14px auto 0;max-width:340px;text-align:center}
.champ .crown{font-size:44px}
.champ .pc{border-color:var(--accent);box-shadow:0 0 0 4px #c8ff3d22,0 20px 60px #c8ff3d22}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.mini .ph{width:42px;height:42px;border-radius:10px;flex:none}
.mini .ph .sil .ini{font-size:12px}
.mini .k{font-weight:800;font-size:14px;line-height:1.2;word-break:keep-all}
.mini .c{font-size:11px;color:var(--muted)}
.mini .rk{margin-left:auto;font-size:11px;color:var(--accent);font-weight:800;white-space:nowrap}

/* SQUAD */
.pitch{position:relative;margin:12px auto 0;max-width:560px;aspect-ratio:3/4;border-radius:20px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1d6b38 0 9.09%,#1a6233 9.09% 18.18%);box-shadow:inset 0 0 80px #0006}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:23%;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot .av{width:min(60px,13.5vw);height:min(60px,13.5vw);border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px #0007}
.slot .av .ph{width:100%;height:100%}
.slot .av .ph .sil .ini{font-size:11px;bottom:12%}
.slot .nm{font-size:12px;font-weight:900;background:#081018d9;padding:3px 7px;border-radius:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:keep-all}
.slot .sp{font-size:10px;font-weight:800;color:#e8ffe0d0}
.slot.empty .av{border-style:dashed;border-color:#ffffffa0;background:#0003;display:grid;place-items:center;font-size:22px;color:#fff}
.slot .star{position:absolute;top:-6px;right:12%;font-size:16px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.slist{margin-top:14px;display:grid;gap:6px}
.slist .mini .rk{color:var(--muted);font-weight:700}

/* DEX */
.dexbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:16px;outline:none}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(min-width:600px){.dgrid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){.dgrid{grid-template-columns:repeat(6,1fr)}}
.dc{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;position:relative}
.dc .ph{aspect-ratio:3/4}
.dc .ph .sil .ini{font-size:14px}
.dc .k{font-size:12.5px;font-weight:800;padding:6px 7px 0;line-height:1.25;word-break:keep-all}
.dc .c{font-size:10.5px;color:var(--muted);padding:0 7px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .posb{position:absolute;left:5px;top:5px}
.dc .ok{position:absolute;right:5px;top:5px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center;font-weight:900}

/* MODAL */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#000b}
.modal.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--sab))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0;font-size:20px}
.ped{display:grid;grid-template-columns:110px 1fr;gap:14px;margin-top:14px;align-items:start}
.ped .ph{aspect-ratio:3/4;border-radius:12px}
.step{margin-top:14px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.step .h{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.step .h i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;flex:none}
.step p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.paste{margin-top:8px;min-height:84px;border:2px dashed #4f6a9c;border-radius:12px;display:block;text-align:center;padding:18px 10px;color:var(--muted);font-size:13.5px;line-height:1.45;outline:none;background:#0a1120;-webkit-user-select:text;user-select:text;caret-color:transparent}
.paste:focus{border-color:var(--accent);color:var(--text)}
.paste img{display:none}
a.btn{text-decoration:none;color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:#f2f7ff;color:#0a1120;font-weight:800;padding:11px 16px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{opacity:.5;pointer-events:none}
.cand{display:grid;gap:6px;margin-top:10px;max-height:52dvh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <section id="v-home" class="view on"></section>
  <section id="v-match" class="view"></section>
  <section id="v-result" class="view"></section>
  <section id="v-squad" class="view"></section>
  <section id="v-dex" class="view"></section>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<input id="file" type="file" accept="image/*" hidden>
<input id="packfile" type="file" accept=".json,application/json" hidden>

  const [ko,en,pos,club]=l.split('|');const id=slug(en);const p={id,ko,en,pos,club,cat};BASE.push(p);BASE_BY[id]=p;});})();

function normRoster(r){r=(r&&typeof r==='object')?r:{};return {edits:(r.edits&&typeof r.edits==='object'&&!Array.isArray(r.edits))?r.edits:{},added:Array.isArray(r.added)?r.added:[],removed:Array.isArray(r.removed)?r.removed.filter(x=>typeof x==='string'):[],t:+r.t||0}}
let ROSTER=normRoster((()=>{try{return JSON.parse(localStorage.getItem('lwc_roster'))}catch(e){return null}})());
function applyRoster(){
  PLAYERS=[];for(const k in BYID)delete BYID[k];
  const rm=new Set(ROSTER.removed);
  const mk=(b,e)=>{const o=Object.assign({},b);if(e&&typeof e==='object'){for(const f of ['ko','en','club'])if(typeof e[f]==='string'&&e[f].trim())o[f]=e[f].trim().slice(0,60);if(POSES.includes(e.pos))o.pos=e.pos}
    o.cat=catOf(o.pos);o.hidden=rm.has(o.id);return o};
  BASE.forEach(b=>{const p=mk(b,ROSTER.edits[b.id]);p.base=true;p.edited=!!ROSTER.edits[b.id];PLAYERS.push(p);BYID[p.id]=p});
  ROSTER.added.forEach(a=>{if(!a||typeof a.id!=='string'||!/^c-[a-z0-9-]{1,80}$/.test(a.id)||BYID[a.id])return;
    const p=mk({id:a.id,ko:'',en:'',pos:'ST',club:''},a);if(!p.ko||!p.en)return;p.custom=true;PLAYERS.push(p);BYID[p.id]=p});
}
applyRoster();
const active = () => PLAYERS.filter(p=>!p.hidden);
const poolOf = m => m==='ALL'?active():active().filter(p=>p.cat===m);

// 1) 로컬: IndexedDB (이 기기 브라우저)  2) 클라우드: 아티팩트 db + assets (내 계정, PC·모바일 공유)
const Local = {db:null, photos:{}};
const Cloud = {db:null, assets:null, uid:null, photos:{}, raw:{}, ready:false};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('legend-wc',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{Local.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
function idbAll(){return new Promise(res=>{if(!Local.db)return res({});try{const out={};const tx=Local.db.transaction('photos','readonly');const st=tx.objectStore('photos');const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res({})}})}
function idbPut(k,v){return new Promise(res=>{if(!Local.db)return res(false);try{const tx=Local.db.transaction('photos','readwrite');tx.objectStore('photos').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
function idbDel(k){return new Promise(res=>{if(!Local.db)return res(false);try{const tx=Local.db.transaction('photos','readwrite');tx.objectStore('photos').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
const Site = {photos:{}, n:0};   // 사이트에 올린 pack.json (모든 방문자 공통)
const photoOf = id => Local.photos[id] || Cloud.photos[id] || Site.photos[id] || null;
const photoCount = () => active().reduce((n,p)=>n+(photoOf(p.id)?1:0),0);
const canCloudUpload = () => !!(Cloud.db && Cloud.assets);

function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function dataURLToBlob(d){const [h,b]=d.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/png';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);const w=img.naturalWidth,h=img.naturalHeight;
    const R=3/4;let sx=0,sy=0,cw=w,ch=h;
    if(w/h>R){cw=h*R;sx=(w-cw)/2}else{ch=w/R;sy=(h-ch)*0.18}
    const W=360,H=480;const c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,sx,sy,cw,ch,0,0,W,H);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
  }finally{URL.revokeObjectURL(url)}
}
async function savePhoto(id,blob){
  if(canCloudUpload()){
    try{
      const r=await Cloud.assets.upload(blob);
      const old=Cloud.raw[id];
      await Cloud.db.doc('photos/'+id).set({a:r.id,u:r.url||'',t:Date.now()});
      Cloud.raw[id]={a:r.id,u:r.url||''};Cloud.photos[id]=r.url||('/_blob/'+r.id);
      if(old&&old.a&&old.a!==r.id){Cloud.assets.delete(old.a).catch(()=>{})}
      if(Local.photos[id]){delete Local.photos[id];idbDel(id)}
      return 'cloud';
    }catch(e){console.warn('cloud upload failed',e)}
  }
  const d=await blobToDataURL(blob);Local.photos[id]=d;await idbPut(id,d);return 'local';
}
async function removePhoto(id){
  if(Local.photos[id]){delete Local.photos[id];await idbDel(id)}
  if(Cloud.raw[id]&&Cloud.db){try{const a=Cloud.raw[id].a;await Cloud.db.doc('photos/'+id).delete();delete Cloud.raw[id];delete Cloud.photos[id];if(Cloud.assets&&a)Cloud.assets.delete(a).catch(()=>{})}catch(e){toast('클라우드 사진은 편집 권한이 있어야 지울 수 있어요')}}
}

let syncMsg='📱 사진·기록이 이 기기 브라우저에 저장돼요';
async function initCloud(){
  for(let i=0;i<24&&!(window.claude&&typeof window.claude.use==='function');i++)await sleep(250);
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  let db=null,user=null,assets=null;
  try{[db,user,assets]=await Promise.all([claude.use('db'),claude.use('user').catch(()=>null),claude.use('assets').catch(()=>null)])}catch(e){return}
  if(!db)return;
  Cloud.db=db;Cloud.assets=assets||null;
  try{Cloud.uid=user?await user.id():null}catch(e){Cloud.uid=null}
  syncMsg = Cloud.assets ? '☁️ 사진이 내 계정에 저장돼 PC·모바일에서 함께 보여요' : '👀 공유된 사진을 보는 중 (내가 올린 사진은 이 기기에만 저장)';
  try{
    db.collection('photos').limit(1000).onSnapshot(snap=>{
      const m={},raw={};snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.a==='string'&&BYID[d.id]){raw[d.id]=v;m[d.id]=(typeof v.u==='string'&&v.u)?v.u:('/_blob/'+v.a)}});
      Cloud.photos=m;Cloud.raw=raw;Cloud.ready=true;refreshPhotos();
    },e=>console.warn('photos sub',e));
    let first=true;
    db.doc('roster/main').onSnapshot(d=>{
      const r=d.exists?normRoster(d.data()):null;
      if(first){first=false;if(ROSTER.t&&(!r||ROSTER.t>r.t)){pushRoster();return}}
      if(r&&r.t>ROSTER.t){ROSTER=r;lsSet('lwc_roster',ROSTER);applyRoster();rerender();if($('#modal').classList.contains('on')&&MODAL.type==='photo')renderPhotoModal()}
    },e=>console.warn('roster sub',e));
  }catch(e){console.warn(e)}
  if(Cloud.uid){
    try{const s=await db.doc('data/users/'+Cloud.uid+'/state').get();
      if(s.exists){const v=s.data()||{};let changed=false;
        for(const k of Object.keys(MODES)){const c=v.results&&v.results[k];if(c&&validIds(c.order)&&(!R[k]||(c.date||0)>(R[k].date||0))){R[k]=c;changed=true}}
        if(v.override&&typeof v.override==='object'&&(v.t||0)>(lsGet('lwc_ovt',0))){OV=Object.assign({},v.override);changed=true}
        if(changed){lsSet('lwc_results',R);lsSet('lwc_override',OV)}
      }
    }catch(e){console.warn(e)}
  }
  rerender();
}

const pow2 = n => {let P=1;while(P*2<=n)P*=2;return P};
const roundPath = n => {const a=[n];while(n>1){n=Math.ceil(n/2);a.push(n)}return a};
const matchInfo = n => {const a=roundPath(n);return (n===pow2(n)?'':a.slice(0,-1).join('→')+' · ')+`총 ${n-1}경기`};

   <div class="cand" style="max-height:none">${sizeList(mode).map(sz=>{const n=cntOf(mode,sz);
     return `<button class="mini" data-act="go-size" data-m="${mode}" data-v="${sz}" ${sz===cur?'style="border-color:var(--accent)"':''}>
       <div class="disp" style="font-size:24px;min-width:84px;color:${mode==='ALL'?'var(--accent)':'var(--'+mode+')'}">${n}강</div>
       <div><div class="k">${sz==='full'?'전체 출전 ('+n+'명 전원)':'랜덤 '+n+'명 추첨'}</div><div class="c">${matchInfo(n)}</div></div>
       <span class="rk">${sz===cur?'최근 선택':''}</span></button>`}).join('')}</div>
   <div class="muted" style="font-size:12px;margin-top:10px">매 라운드 살아남은 선수 전원이 출전해 절반씩 줄어요. 홀수 라운드에서는 1명이 무작위로 부전승해요.</div>`;
  openModal();
}
function startTournament(mode,size){
  if(size===undefined)size=sizeOf(mode);
  let ids=shuffle(poolOf(mode).map(p=>p.id));
  if(size!=='full'&&ids.length>size)ids=ids.slice(0,size);
  T={mode,size,n:ids.length,total:ids.length-1,played:0,elim:[],hist:[]};
  setupRound(ids);saveProgress();show('match');
}
function setupRound(ent){
  const len=ent.length,m=Math.floor(len/2);
  T.cur=ent.slice(0,2*m);T.byes=ent.slice(2*m);T.prelim=false;
  T.label=len===2?'결승':len===4?'준결승':len+'강';
  T.rsize=len;T.i=0;T.win=[];
}
function saveProgress(){if(T)lsSet('lwc_progress',T);else lsDel('lwc_progress')}
function pick(side){
  const a=T.cur[2*T.i],b=T.cur[2*T.i+1];
  T.hist.push({cur:T.cur,byes:T.byes,prelim:T.prelim,label:T.label,rsize:T.rsize,i:T.i,win:T.win.slice(),played:T.played,el:T.elim.length});
  if(T.hist.length>15)T.hist.shift();
  const w=side?b:a,l=side?a:b;
  T.win.push(w);T.elim.push([l,T.prelim?0:T.rsize]);T.played++;T.i++;
  if(T.i*2>=T.cur.length){
    const next=(T.prelim||T.byes.length)?shuffle(T.win.concat(T.byes)):T.win.slice();
    if(next.length===1){finish(next[0]);return}
    setupRound(next);
  }
  saveProgress();renderMatch();
}
function undo(){if(!T||!T.hist.length)return;const s=T.hist.pop();Object.assign(T,{cur:s.cur,byes:s.byes,prelim:s.prelim,label:s.label,rsize:s.rsize,i:s.i,win:s.win,played:s.played});T.elim.length=s.el;saveProgress();renderMatch()}
function finish(champ){
  const order=[champ,...T.elim.map(e=>e[0]).reverse()];
  R[T.mode]={order,date:Date.now(),n:T.n,size:T.size};
  LAST={mode:T.mode,n:T.n,champ,elim:T.elim.slice(-40)};lsSet('lwc_last',LAST);
  T=null;saveProgress();persistState();show('result');
}

}

function renderResult(){
  if(!LAST||!BYID[LAST.champ]){show('home');return}
  const c=BYID[LAST.champ];
  const group=rs=>LAST.elim.filter(e=>e[1]===rs).map(e=>BYID[e[0]]).filter(Boolean).reverse();

 {k:'LW',lb:'LW',cat:'FW',x:17,y:17,pri:['LW'],sec:['LM','CF','RW','ST']},
 {k:'ST',lb:'ST',cat:'FW',x:50,y:11,pri:['ST','CF'],sec:['LW','RW','CAM']},
 {k:'RW',lb:'RW',cat:'FW',x:83,y:17,pri:['RW'],sec:['RM','CF','LW','ST']},
 {k:'LCM',lb:'CM',cat:'MF',x:24,y:41,pri:['CM','CAM'],sec:['LM','RM','CDM']},
 {k:'CDM',lb:'CDM',cat:'MF',x:50,y:51,pri:['CDM'],sec:['CM','SW','CB']},
 {k:'RCM',lb:'CM',cat:'MF',x:76,y:41,pri:['CM','CAM'],sec:['RM','LM','CDM']},
 {k:'LB',lb:'LB',cat:'DF',x:13,y:65,pri:['LB'],sec:['RB','LM']},
 {k:'LCB',lb:'CB',cat:'DF',x:36,y:71,pri:['CB','SW'],sec:['CDM','LB','RB']},
 {k:'RCB',lb:'CB',cat:'DF',x:64,y:71,pri:['CB','SW'],sec:['CDM','RB','LB']},
 {k:'RB',lb:'RB',cat:'DF',x:87,y:65,pri:['RB'],sec:['LB','RM']},
 {k:'GK',lb:'GK',cat:'GK',x:50,y:89,pri:['GK'],sec:[]}
];
function candidates(slot){
  const keys = PREF==='pos' ? [slot.cat,'ALL','FW','MF','DF','GK'] : ['ALL',slot.cat,'FW','MF','DF','GK'];
  const seen=new Set(),out=[];
  for(const k of keys){const r=R[k];if(!r||seen.has('m'+k))continue;seen.add('m'+k);
    r.order.forEach((id,i)=>{if(!seen.has(id)&&BYID[id]&&!BYID[id].hidden){seen.add(id);out.push({id,src:k,rank:i+1})}})}
  return out;
}
function buildSquad(){
  const used=new Set(),out={};
  for(const s of SLOTS){const id=OV[s.k];if(id&&BYID[id]&&!BYID[id].hidden&&!used.has(id)){out[s.k]={id,src:'manual'};used.add(id)}}
  for(const pass of ['pri','sec'])for(const s of SLOTS){if(out[s.k])continue;
    const c=candidates(s).find(c=>!used.has(c.id)&&s[pass].includes(BYID[c.id].pos));
    if(c){out[s.k]=c;used.add(c.id)}}
  return out;
}

function onPaste(e){

  const files=(e.clipboardData&&e.clipboardData.files)||[];
  if(files.length&&files[0].type.startsWith('image/')){e.preventDefault();acceptFile(files[0]);return}
  // 이미지 대신 HTML/텍스트가 붙은 경우: input 이벤트에서 처리
}
function onDrop(e){e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)acceptFile(f);else toast('웹 이미지는 끌어다 놓을 수 없어요. 복사 후 붙여넣기 해주세요')}

  const z=$('#paste');if(!z)return;const img=z.querySelector('img');
  if(img&&img.src&&img.src.startsWith('data:image')){const b=dataURLToBlob(img.src);acceptFile(new File([b],'paste',{type:b.type}));return}
  if(img&&img.src&&img.src.startsWith('blob:')){fetch(img.src).then(r=>r.blob()).then(b=>acceptFile(new File([b],'paste',{type:b.type||'image/png'}))).catch(()=>toast('이미지를 읽지 못했어요. 저장 후 갤러리에서 골라주세요'));return}
  toast(img?'웹 주소 이미지는 직접 불러올 수 없어요. ‘이미지 복사’ 또는 ‘저장 → 갤러리 선택’을 써주세요':'이미지가 아니라 글자가 붙여넣어졌어요. ‘이미지 복사’로 다시 시도해 주세요');
  renderPhotoModal();
}
$('#file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)acceptFile(f)});

function openSlot(k){MODAL={type:'slot',k,q:''};renderSlotModal();openModal()}
function renderSlotModal(){
  const s=SLOTS.find(x=>x.k===MODAL.k);const sq=buildSquad();const cur=sq[s.k];
  const usedElse=new Set(Object.entries(sq).filter(([k])=>k!==s.k).map(([,c])=>c.id));
  const ranked=candidates(s).filter(c=>s.pri.concat(s.sec).includes(BYID[c.id].pos));
  const rankedIds=new Set(ranked.map(c=>c.id));
  const rest=active().filter(p=>s.pri.includes(p.pos)&&!rankedIds.has(p.id)).map(p=>({id:p.id,src:null}));
  const q=(MODAL.q||'').trim().toLowerCase();
  const all=ranked.concat(rest).filter(c=>{const p=BYID[c.id];return !q||p.ko.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)}).slice(0,80);
  const row=c=>{const p=BYID[c.id];const tag=c.src?`${MODES[c.src].ko} ${c.rank}위`:'';const inUse=usedElse.has(c.id);
    return `<button class="mini" data-act="setslot" data-id="${c.id}" ${cur&&cur.id===c.id?'style="border-color:var(--accent)"':''}>${avatar(p)}<div><div class="k">${esc(p.ko)}${inUse?' <span class="muted" style="font-size:11px">(다른 자리)</span>':''}</div><div class="c">${esc(p.pos)} · ${esc(p.club)}</div></div><span class="rk">${tag}</span></button>`};
  $('#sheet').innerHTML=`<div class="row" style="justify-content:space-between"><h3>${s.lb} 자리 선수 선택</h3><button class="btn sm" data-act="close">닫기</button></div>
   <div class="row" style="margin-top:10px">${cur?`<button class="btn sm" data-act="photo" data-id="${cur.id}">📷 ${esc(BYID[cur.id].ko)} 사진</button>`:''}${OV[s.k]?`<button class="btn sm" data-act="autoslot">↺ 자동 선택으로</button>`:''}</div>
   <input class="search" id="sq" style="margin-top:10px" placeholder="이름 검색" value="${esc(MODAL.q||'')}" autocomplete="off">
   <div class="muted" style="font-size:12px;margin-top:8px">토너먼트 순위가 높은 선수부터 보여요</div>
   <div class="cand">${all.map(row).join('')||'<div class="muted">해당 선수가 없어요</div>'}</div>`;
  const inp=$('#sq');inp.addEventListener('input',e=>{MODAL.q=e.target.value;const pos=e.target.selectionStart;renderSlotModal();const n=$('#sq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}});
}
function setOverride(k,id){
  for(const [kk,v] of Object.entries(OV))if(v===id&&kk!==k)delete OV[kk];
  if(id)OV[k]=id;else delete OV[k];lsSet('lwc_ovt',Date.now());persistState();
}
function confirmBox(msg,yesLabel,onYes){MODAL={type:'confirm'};$('#sheet').innerHTML=`<h3 style="font-size:17px;line-height:1.5">${msg}</h3><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-act="close">취소</button><button class="btn pri" id="cyes">${yesLabel}</button></div>`;openModal();$('#cyes').onclick=()=>{closeModal();onYes()}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('복사했어요')}catch(e){MODAL={type:'copy'};$('#sheet').innerHTML=`<div class="row" style="justify-content:space-between"><h3>복사하기</h3><button class="btn sm" data-act="close">닫기</button></div><textarea class="search" style="height:220px;margin-top:10px" readonly>${esc(t)}</textarea>`;openModal()}}

/* ===================== EVENTS ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='photo'){e.stopPropagation();e.preventDefault();openPhoto(el.dataset.id,el.dataset.ctx||'');return}
  switch(a){
    case 'pick':choose(+el.dataset.side);break;
    case 'start':openSize(el.dataset.m);break;
    case 'go-size':{const m=el.dataset.m,sz=el.dataset.v==='full'?'full':+el.dataset.v;SZ[m]=sz;lsSet('lwc_sizes',SZ);
      $('#modal').classList.remove('on');document.body.style.overflow='';MODAL={type:null};
      if(T){confirmBox(`진행 중인 ${MODES[T.mode].ko} ${T.n}강 토너먼트가 있어요.<br>새로 시작할까요?`,'새로 시작',()=>startTournament(m,sz))}else startTournament(m,sz);break}
    case 'resume':show('match');break;
    case 'abandon':confirmBox('진행 중인 토너먼트를 그만둘까요?','그만두기',()=>{T=null;saveProgress();renderHome()});break;
    case 'home':show('home');break;
    case 'go':show(el.dataset.v);break;
    case 'undo':undo();break;
    case 'pref':PREF=el.dataset.v;lsSet('lwc_pref',PREF);renderSquad();break;
    case 'slot':openSlot(el.dataset.k);break;
    case 'setslot':setOverride(MODAL.k,el.dataset.id);closeModal();break;
    case 'autoslot':setOverride(MODAL.k,null);closeModal();break;
    case 'resetov':OV={};lsSet('lwc_ovt',Date.now());persistState();renderSquad();break;
    case 'copysq':copyText(squadText());break;
    case 'copyres':{const c=BYID[LAST.champ];const g=rs=>LAST.elim.filter(x=>x[1]===rs).map(x=>BYID[x[0]].ko).reverse();
      const r3=[...new Set(LAST.elim.map(e=>e[1]).filter(x=>x>2))].sort((a,b)=>a-b)[0];
      copyText(`🏆 나의 ${MODES[LAST.mode].ko} ${LAST.n}강 우승: ${c.ko} (${c.club})\n🥈 준우승: ${g(2).join(', ')}${r3?`\n${r3}강: ${g(r3).join(', ')}`:''}\n#레전드월드컵`);break}
    case 'exportpack':exportPack(el);break;
    case 'importpack':$('#packfile').click();break;
    case 'addp':openEdit(null);break;
    case 'editp':openEdit(el.dataset.id);break;
    case 'revertp':delete ROSTER.edits[el.dataset.id];saveRoster();toast('기본 정보로 되돌렸어요');openPhoto(el.dataset.id,'dex');break;
    case 'restorep':ROSTER.removed=ROSTER.removed.filter(x=>x!==el.dataset.id);saveRoster();toast('명단에 복원했어요');openPhoto(el.dataset.id,'dex');break;
    case 'removep':{const id=el.dataset.id,p=BYID[id];confirmBox(`${esc(p.ko)} 선수를 ${p.custom?'삭제':'명단에서 뺄'}까요?`,p.custom?'삭제':'빼기',()=>{
      if(p.custom){ROSTER.added=ROSTER.added.filter(x=>x.id!==id);for(const k in OV)if(OV[k]===id)delete OV[k]}
      else if(!ROSTER.removed.includes(id))ROSTER.removed.push(id);saveRoster();toast('반영했어요')});break}
    case 'resetroster':confirmBox('수정·추가·제외한 내용을 모두 지우고 기본 500명 명단으로 되돌릴까요?','되돌리기',()=>{ROSTER={edits:{},added:[],removed:[],t:0};saveRoster();toast('기본 명단으로 되돌렸어요')});break;
    case 'dcat':DX.cat=el.dataset.v;DX.limit=60;renderDex();break;
    case 'dmiss':DX.missing=!DX.missing;DX.limit=60;renderDex();break;
    case 'more':DX.limit+=60;renderDex();break;
    case 'close':closeModal();break;
    case 'pickfile':$('#file').click();break;
    case 'delphoto':{const id=MODAL.id;removePhoto(id).then(()=>{toast('삭제했어요');renderPhotoModal();rerender()});break}
  }
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeModal();return}
  if(VIEW!=='match')return;
  if(e.key==='ArrowLeft')choose(0);else if(e.key==='ArrowRight')choose(1);else if(e.key==='z'||e.key==='Z'||e.key==='Backspace')undo();
});

/* ===================== BOOT ===================== */
/* ===================== PACK (사진·명단 내보내기/가져오기) ===================== */
const okImg = v => typeof v==='string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v) && v.length<2e6;
async function loadSitePack(){
  if(!/^https?:$/.test(location.protocol))return;
  try{const r=await fetch('pack.json',{cache:'no-cache'});if(!r.ok)return;const p=await r.json();
    const ph={};if(p&&p.photos&&typeof p.photos==='object')for(const [k,v] of Object.entries(p.photos))if(okImg(v))ph[k]=v;
    Site.photos=ph;Site.n=Object.keys(ph).length;
    if(p&&p.roster){const r2=normRoster(p.roster);if(r2.t>ROSTER.t){ROSTER=r2;applyRoster()}}
    rerender();
  }catch(e){}
}
async function srcToDataURL(src){if(src.startsWith('data:'))return src;const r=await fetch(src);return await blobToDataURL(await r.blob())}
async function exportPack(btn){
  if(btn)btn.classList.add('busy');toast('사진을 모으는 중…');
  try{
    const photos={};
    for(const p of PLAYERS){const src=photoOf(p.id);if(!src)continue;try{photos[p.id]=await srcToDataURL(src)}catch(e){}}
    const pack={v:1,t:Date.now(),roster:ROSTER,photos};
    const json=JSON.stringify(pack);
    let done=false;
    if(window.claude&&typeof window.claude.use==='function'){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:'pack.json',data:json});done=true}}catch(e){console.warn(e)}}
    if(!done){const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='pack.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
    toast(`pack.json 저장 (사진 ${Object.keys(photos).length}장)`);
  }catch(e){console.warn(e);toast('내보내기에 실패했어요')}
  if(btn)btn.classList.remove('busy');
}
async function importPack(file){
  try{const p=JSON.parse(await file.text());let n=0;
    if(p&&p.photos&&typeof p.photos==='object')for(const [k,v] of Object.entries(p.photos)){if(okImg(v)&&(BYID[k]||/^c-[a-z0-9-]{1,80}$/.test(k))){Local.photos[k]=v;await idbPut(k,v);n++}}
    if(p&&p.roster){ROSTER=normRoster(p.roster);saveRoster()}
    rerender();toast(`가져오기 완료 (사진 ${n}장${p&&p.roster?' · 명단 포함':''})`);
  }catch(e){toast('pack.json 파일을 읽지 못했어요')}
}
$('#packfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importPack(f)});

(async function boot(){
  renderHome();
  if(await idbOpen()){Local.photos=await idbAll();rerender()}
  loadSitePack();
  initCloud();
})();
</script>
